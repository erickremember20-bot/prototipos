/* ==== src/styles/tokens.css ==== */
/* ------------------------------------------------------------------
   Design tokens — espelham 1:1 as variáveis do Figma
   Arquivo: otFCFq9vy3mUvwLcb11hwf  ·  Página "Campanha — Telas Mobile"
   ------------------------------------------------------------------ */
:root {
  /* Neutros */
  --grey-50: #ffffff;
  --grey-100: #b6b6b6;
  --grey-200: #939393;
  --grey-300: #626262;
  --grey-400: #434343;
  --grey-500: #141414;
  --grey-600: #121212;
  --grey-900: #080808;

  /* Verde neon — ação principal da campanha */
  --green-300: #c7fe55;
  --green-500: #abfe02;
  --green-700: #79b401;
  --green-900: #486b01;

  /* Roxo elétrico — ação secundária / destaque */
  --purple-300: #8f69ff;
  --purple-500: #581fff;
  --purple-700: #3e16b5;

  /* Feedback */
  --red-500: #ed2424;

  /* Papéis semânticos */
  --surface-canvas: var(--grey-900);
  --surface-section: var(--grey-600);
  --surface-modal: var(--grey-500);
  --border-input: var(--grey-400);
  --border-input-filled: var(--grey-300);
  --text-primary: var(--grey-50);
  --text-muted: var(--grey-100);
  --text-placeholder: var(--grey-300);

  /* Gradientes do design */
  --grad-steps: linear-gradient(180deg, rgba(37, 13, 107, 0.65) 0%, #121212 100%);
  --grad-tile: linear-gradient(135deg, rgb(121, 76, 255) 0%, rgb(80, 28, 232) 71.429%);
  --grad-card-cupom: linear-gradient(90deg, #3e16b5 0%, rgba(37, 13, 107, 0.35) 100%);
  --grad-card-sorte: linear-gradient(90deg, rgba(72, 107, 1, 0.85) 0%, #141414 100%);
  --grad-cta-glow: linear-gradient(90deg, #bcfe35 0%, #79b401 100%);
  --grad-cta-glow-pressed: linear-gradient(90deg, #79b401 0%, #486b01 100%);

  /* Sombras / glows */
  --glow-tile: 0 0 22px 0 rgba(88, 31, 255, 0.55);
  --glow-neon: 0 0 9px rgba(171, 254, 2, 0.35);
  --glow-neon-strong: 0 0 10px rgba(171, 254, 2, 0.45);
  --glow-purple: 0 0 10px rgba(88, 31, 255, 0.5);
  --glow-focus: 0 0 7px rgba(88, 31, 255, 0.45);

  /* Tipografia — escala Barlow do Figma */
  --font-family: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --h1-size: 24px;
  --h2-size: 20px;
  --h3-size: 16px;
  --body-size: 14px;
  --small-size: 12px;
  --heading-leading: 1.2;
  --body-leading: 1.5;

  /* Layout */
  --shell-width: 360px;
  --gutter: 16px;
  --radius-input: 8px;
  --radius-card: 16px;
  --radius-modal: 24px;
  --radius-pill: 100px;

  /* Movimento */
  --ease: 0.2s ease-in-out;
}

/* ==== src/styles/base.css ==== */
/* ------------------------------------------------------------------
   Reset enxuto + shell da página
   ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--surface-canvas);
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: var(--body-size);
  line-height: var(--body-leading);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

/* Fundo do "palco" fora do shell em telas largas */
@media (min-width: 600px) {
  body {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(88, 31, 255, 0.18) 0%, transparent 60%),
      var(--surface-canvas);
    padding: 24px 16px;
  }
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}

input {
  font: inherit;
  color: inherit;
}

/* Sem margens do UA: todo o espaçamento vem dos `gap` definidos no Figma */
p,
h1,
h2,
h3,
h4,
h5,
h6 {
  margin: 0;
  font-size: inherit;
  font-weight: inherit;
}

svg {
  display: block;
}

/* O shell reproduz o frame de 360px do Figma e cresce até 420px no desktop */
.shell {
  width: 100%;
  max-width: var(--shell-width);
  background: var(--surface-canvas);
  position: relative;
  overflow: hidden;
}

@media (min-width: 600px) {
  .shell {
    max-width: 420px;
    border-radius: var(--radius-modal);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
}

/* Tipografia utilitária alinhada aos estilos do Figma */
.t-h1 {
  font-size: var(--h1-size);
  font-weight: 700;
  line-height: var(--heading-leading);
}

.t-h2 {
  font-size: var(--h2-size);
  font-weight: 700;
  line-height: var(--heading-leading);
}

.t-h3 {
  font-size: var(--h3-size);
  font-weight: 600;
  line-height: var(--heading-leading);
}

.t-body {
  font-size: var(--body-size);
  font-weight: 400;
  line-height: var(--body-leading);
}

.t-small {
  font-size: var(--small-size);
  font-weight: 400;
  line-height: var(--body-leading);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

/* ==== src/styles/components.css ==== */
/* ==================================================================
   COMPONENTES — cada bloco corresponde a um símbolo do Figma
   ================================================================== */

/* ---------- Header (16:2) --------------------------------------- */
.header {
  background: var(--surface-canvas);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px var(--gutter);
  overflow: hidden;
}

/* O "×" entre as marcas é o separador de co-branding, não um botão */
.header__x {
  color: var(--grey-50);
  flex-shrink: 0;
}

/* ---------- Marcas / KV ----------------------------------------- */
.brand {
  display: block;
  flex-shrink: 0;
  position: relative;
}

.brand__img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: left center;
}

/* O fallback fica visível até o export real do Figma ser adicionado */
.brand__img[hidden] {
  display: none;
}

.kv {
  width: 100%;
  height: 184px;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}

.kv__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

.kv__img[hidden] {
  display: none;
}

/* `hidden` precisa vencer os display: flex/block dos fallbacks */
.kv__fallback[hidden],
.logo-fallback[hidden] {
  display: none;
}

/* Placeholder do key visual (nó 16:34), na composição do asset original:
   céu lavanda, texto à esquerda, gramado com a linha do círculo central. */
.kv__fallback {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #d2d1dc 0%, #bfbfd0 58%, #b3b4c6 100%);
  display: flex;
  align-items: flex-start;
  overflow: hidden;
}

/* Gramado + linha do círculo central */
.kv__pitch {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 32%;
  background: linear-gradient(180deg, #63b352 0%, #3f8f36 100%);
}

.kv__pitch::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 22%;
  width: 118px;
  height: 118px;
  transform: translateX(-30%);
  border: 2px solid rgba(255, 255, 255, 0.85);
  border-radius: 50%;
}

.kv__copy {
  position: relative;
  z-index: 1;
  padding: 16px 0 0 14px;
  max-width: 61%;
}

.kv__title {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.1;
  color: #1b1b26;
  letter-spacing: -0.01em;
}

.kv__sub {
  font-size: 9.5px;
  line-height: 1.3;
  color: #33333f;
  margin-top: 4px;
}

.kv__lockup {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}

.kv__rule {
  width: 1px;
  height: 22px;
  background: rgba(27, 27, 38, 0.35);
}

.kv__partner {
  font-size: 7px;
  line-height: 1.3;
  color: #33333f;
  margin-top: 5px;
}

/* ---------- Hero (16:31) ---------------------------------------- */
.hero {
  background: var(--surface-section);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 24px var(--gutter) 16px;
  overflow: hidden;
}

.hero__headline {
  text-align: center;
  width: 100%;
  color: var(--grey-50);
}

.hero__headline em {
  display: block;
  font-style: normal;
  color: var(--green-500);
  /* A linha de destaque mede 329px contra 328px disponíveis em 360px de tela.
     Um toque de tracking negativo a mantém em uma linha, como no Figma. */
  letter-spacing: -0.01em;
}

.hero__subtitle {
  text-align: center;
  width: 100%;
  color: var(--text-muted);
}

/* ---------- Input field (35:33) --------------------------------- */
.field {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  width: 100%;
}

.field__box {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding: 14px;
  border: 1.5px solid var(--border-input);
  border-radius: var(--radius-input);
  transition: border-color var(--ease), box-shadow var(--ease);
}

.field__input {
  flex: 1 0 0;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 14px;
  line-height: 1.4;
  color: var(--grey-50);
}

.field__input::placeholder {
  color: var(--text-placeholder);
  opacity: 1;
}

/* Chip de label flutuante — só aparece com foco/valor */
.field__label {
  position: absolute;
  top: -9.5px;
  left: 8.5px;
  padding: 0 4px;
  background: var(--surface-section);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.2;
  color: var(--text-muted);
  white-space: nowrap;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity var(--ease), transform var(--ease), color var(--ease);
  pointer-events: none;
}

.field.is-filled .field__label,
.field.is-focused .field__label,
.field.is-error .field__label {
  opacity: 1;
  transform: translateY(0);
}

/* State=Filled */
.field.is-filled .field__box {
  border-color: var(--border-input-filled);
}

/* State=Focused */
.field.is-focused .field__box {
  border-color: var(--purple-500);
  box-shadow: var(--glow-focus);
}

/* State=Error */
.field.is-error .field__box {
  border-color: var(--red-500);
  box-shadow: none;
}

.field.is-error .field__label {
  color: var(--red-500);
}

.field__alert {
  flex-shrink: 0;
  color: var(--red-500);
  display: none;
}

.field.is-error .field__alert {
  display: block;
}

.field__helper {
  width: 100%;
  text-align: right;
  font-size: 11px;
  line-height: 1.4;
  color: var(--red-500);
  min-height: 0;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity var(--ease), max-height var(--ease);
}

.field.is-error .field__helper {
  opacity: 1;
  max-height: 34px;
}

/* ---------- Checkbox (34:23) ------------------------------------ */
.checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 0;
  width: 100%;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.checkbox__native {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.checkbox__box {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--grey-300);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--grey-500);
  transition: background-color var(--ease), border-color var(--ease);
}

.checkbox__box svg {
  opacity: 0;
  transform: scale(0.6);
  transition: opacity var(--ease), transform var(--ease);
}

.checkbox__label {
  flex: 1 0 0;
  min-width: 0;
  font-size: 13px;
  line-height: 1.4;
  color: var(--text-muted);
  transition: color var(--ease);
}

/* Checked=True */
.checkbox__native:checked + .checkbox__box {
  background: var(--green-500);
  border-color: var(--green-500);
}

.checkbox__native:checked + .checkbox__box svg {
  opacity: 1;
  transform: scale(1);
}

.checkbox__native:checked ~ .checkbox__label {
  color: var(--green-500);
}

.checkbox__native:focus-visible + .checkbox__box {
  outline: 2px solid var(--purple-300);
  outline-offset: 2px;
}

/* Erro no consentimento obrigatório */
.checkbox.is-error .checkbox__box {
  border-color: var(--red-500);
}

.checkbox.is-error .checkbox__label {
  color: var(--red-500);
}

/* ---------- Button (33:108) ------------------------------------- */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px 20px;
  border-radius: var(--radius-pill);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  transition: background var(--ease), box-shadow var(--ease), opacity var(--ease), transform var(--ease);
}

.btn:active:not(:disabled):not([aria-disabled="true"]) {
  transform: scale(0.98);
}

.btn:focus-visible {
  outline: 2px solid var(--purple-300);
  outline-offset: 3px;
}

/* Type=Primary Neon */
.btn--primary {
  background: var(--green-500);
  color: var(--grey-500);
  box-shadow: var(--glow-neon);
}

.btn--primary:hover:not(:disabled):not([aria-disabled="true"]) {
  background: var(--green-300);
}

.btn--primary:active:not(:disabled):not([aria-disabled="true"]) {
  background: var(--green-700);
  box-shadow: none;
}

.btn--primary:disabled,
.btn--primary[aria-disabled="true"] {
  background: var(--green-900);
  opacity: 0.55;
  box-shadow: none;
  cursor: not-allowed;
}

/* Type=Secondary Glow */
.btn--glow {
  background: var(--grad-cta-glow);
  color: var(--grey-500);
  box-shadow: var(--glow-neon-strong);
}

.btn--glow:active:not(:disabled):not([aria-disabled="true"]) {
  background: var(--grad-cta-glow-pressed);
  box-shadow: none;
}

.btn--glow:disabled,
.btn--glow[aria-disabled="true"] {
  background: var(--green-900);
  opacity: 0.5;
  box-shadow: none;
  cursor: not-allowed;
}

/* Type=Tertiary Purple */
.btn--purple {
  background: var(--purple-500);
  color: var(--grey-50);
  box-shadow: var(--glow-purple);
}

.btn--purple:active:not(:disabled):not([aria-disabled="true"]) {
  background: var(--purple-700);
  box-shadow: none;
}

.btn--purple:disabled,
.btn--purple[aria-disabled="true"] {
  background: var(--purple-700);
  color: var(--grey-200);
  opacity: 0.5;
  box-shadow: none;
  cursor: not-allowed;
}

/* Spinner do estado de loading do submit */
.btn__spinner {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(20, 20, 20, 0.3);
  border-top-color: var(--grey-500);
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---------- Form (16:44) ---------------------------------------- */
.form {
  background: var(--surface-section);
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 16px var(--gutter) 24px;
}

.form__consents {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* ---------- Como participar (16:66) ----------------------------- */
.steps-section {
  background: var(--grad-steps);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 28px var(--gutter) 32px;
  overflow: hidden;
}

.steps-section__title {
  text-align: center;
  width: 100%;
  color: var(--grey-50);
}

.steps {
  display: flex;
  gap: 8px;
  width: 100%;
}

.step {
  flex: 1 0 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.step__tile {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: var(--grad-tile);
  box-shadow: var(--glow-tile);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--grey-50);
}

.step__label {
  width: 100%;
  text-align: center;
  color: var(--grey-50);
}

/* ---------- Footer legal (16:87) -------------------------------- */
.footer-legal {
  background: var(--surface-canvas);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 20px var(--gutter) 24px;
  text-align: center;
  overflow: hidden;
}

.footer-legal__text {
  width: 100%;
  color: var(--text-muted);
}

.footer-legal__link {
  width: 100%;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
  color: var(--green-500);
  text-decoration: underline;
  text-underline-position: from-font;
  transition: color var(--ease);
}

.footer-legal__link:hover {
  color: var(--green-300);
}

/* ==================================================================
   MODAIS — overlay compartilhado + telas 02 e 03
   ================================================================== */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  /* Sem padding no mobile: o modal ocupa os mesmos 360px do frame do Figma,
     senão o conteúdo cai para 296px e os títulos quebram fora do previsto. */
  padding: 0;
  background: rgba(4, 4, 4, 0.72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--ease), visibility var(--ease);
  overflow-y: auto;
}

.overlay.is-open {
  opacity: 1;
  visibility: visible;
}

.overlay__panel {
  width: 100%;
  max-width: var(--shell-width);
  border-radius: var(--radius-modal);
  max-height: 100vh;
  overflow-y: auto;
  transform: translateY(16px) scale(0.98);
  transition: transform var(--ease);
  -webkit-overflow-scrolling: touch;
}

.overlay.is-open .overlay__panel {
  transform: translateY(0) scale(1);
}

@media (min-width: 600px) {
  .overlay {
    padding: 16px;
  }

  .overlay__panel {
    max-width: 420px;
    max-height: calc(100vh - 32px);
  }
}

.modal__topbar {
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  width: 100%;
}

.modal__close {
  color: var(--grey-50);
  flex-shrink: 0;
  border-radius: 50%;
  transition: opacity var(--ease), transform var(--ease);
}

.modal__close:hover {
  opacity: 0.7;
}

.modal__close:active {
  transform: scale(0.92);
}

.modal__close:focus-visible {
  outline: 2px solid var(--purple-300);
  outline-offset: 3px;
}

.rules {
  background: var(--surface-modal);

  flex-direction: column;
  gap: 16px;
  padding: 16px var(--gutter) 24px;
  border-radius: var(--radius-modal);
}

.rules__header {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
}

.rules__title {
  color: var(--green-500);

}

.rules__subtitle {
  color: var(--grey-50);
  width: 100%;
}

.rules__divider {
  height: 1px;
  width: 100%;
  background: var(--grey-400);
  flex-shrink: 0;
}

.rules__list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}

/* cmp / rule-block (17:4) */
.rule {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
}

.rule__title {
  color: var(--green-500);
  width: 100%;
}

.rule__body {
  color: var(--grey-50);
  width: 100%;
}

/* ---------- 03 — Sucesso / Voucher (12:45) ---------------------- */
.success {
  background: var(--surface-canvas);
  border-radius: var(--radius-modal);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.success__content {

  display: flex;
  flex-direction: column;
  align-items: center;

  flex-direction: column;

  text-align: center;

  color: var(--grey-50);

}

.success__info {
  width: 100%;
  text-align: center;
  color: var(--green-300);
}

.success__footer {
  background: var(--surface-canvas);
  padding: 18px var(--gutter) 22px;
  text-align: center;
  overflow: hidden;
}

.success__footer p {
  width: 100%;
  color: var(--grey-50);
}

/* cmp / voucher-card (18:73) */
.voucher {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;

  padding: 16px;
  border-radius: var(--radius-card);
  border: 1px solid transparent;
}

.voucher--cupom {

  border-color: var(--purple-300);
}

.voucher--sorte {

}

.voucher__badge {

  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.26px;
  color: var(--grey-50);
  white-space: nowrap;
  overflow: hidden;
}

.voucher__badge em {
  font-style: normal;
  color: var(--green-500);
}

.voucher__helper {
  width: 100%;
  text-align: center;
  color: var(--grey-50);
  transition: color var(--ease);
}

.voucher__helper.is-copied {
  color: var(--green-500);
  font-weight: 600;
}

/* Valor do número da sorte (18:66) */
.voucher__value {
  display: flex;
  align-items: center;

}

.voucher__number {

  font-weight: 700;

  color: var(--green-500);
  white-space: nowrap;
}

.voucher__trophy {
  color: var(--green-500);
  flex-shrink: 0;
}

/* cmp / coupon-tag (34:14) */
.coupon {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 18px;
  border-radius: 12px;
  background: var(--purple-500);
  color: var(--grey-50);
  transition: background var(--ease), transform var(--ease);
}

.coupon:hover {
  background: #6b34ff;
}

.coupon:active {
  transform: scale(0.98);
}

.coupon:focus-visible {
  outline: 2px solid var(--grey-50);

}

}

.coupon__code {

}

.coupon__icon {

  display: flex;
  align-items: center;

}

.coupon__icon svg {

}

@keyframes pop {

}

/**
 * Helper mínimo de criação de DOM — evita innerHTML espalhado pelo código
 * e mantém os componentes legíveis sem depender de framework.
 *
 *   h('div', { class: 'card' }, h('p', {}, 'Olá'))
 *
 * Props especiais: `class`, `html` (innerHTML cru, usado só para SVG inline),
 * `dataset`, `style` (objeto) e qualquer `on*` vira addEventListener.
 */
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);

  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;

    if (key === 'class') {
      el.className = value;
    } else if (key === 'html') {
      el.innerHTML = value;
    } else if (key === 'dataset') {
      Object.assign(el.dataset, value);
    } else if (key === 'style' && typeof value === 'object') {
      Object.assign(el.style, value);
    } else if (key.startsWith('on') && typeof value === 'function') {
      el.addEventListener(key.slice(2).toLowerCase(), value);
    } else if (value === true) {
      el.setAttribute(key, '');
    } else {
      el.setAttribute(key, value);
    }
  }

  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }

  return el;
}

/** Envolve uma string de SVG em um nó, preservando a caixa externa do design. */
function svgNode(markup) {
  const wrapper = document.createElement('span');
  wrapper.style.display = 'contents';
  wrapper.innerHTML = markup;
  return wrapper.firstElementChild;
}

/** Máscara de CPF: 000.000.000-00, aplicada durante a digitação. */
function maskCPF(value) {
  const digits = String(value).replace(/\D/g, '').slice(0, 11);

  return digits
    .replace(/^(\d{3})(\d)/, '$1.$2')
    .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
    .replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
}

/**
 * Aplica a máscara preservando a posição do cursor — sem isso, editar no meio
 * do campo joga o cursor para o fim a cada tecla.
 */
function applyCPFMask(input) {
  const before = input.value;
  const caret = input.selectionStart ?? before.length;
  const digitsBeforeCaret = before.slice(0, caret).replace(/\D/g, '').length;

  const masked = maskCPF(before);
  input.value = masked;

  // Recoloca o cursor após a mesma quantidade de dígitos.
  let seen = 0;
  let position = masked.length;
  for (let i = 0; i < masked.length; i += 1) {
    if (/\d/.test(masked[i])) seen += 1;
    if (seen >= digitsBeforeCaret) {
      position = i + 1;
      break;
    }
  }
  if (digitsBeforeCaret === 0) position = 0;

  input.setSelectionRange(position, position);
}

/** Regras de validação dos campos da tela 01. */

/** Nome obrigatório, mínimo de 3 caracteres. */
function isValidName(value) {
  return String(value).trim().length >= 3;
}

/** Formato de e-mail user@domain.com — sem espaços, com TLD. */
function isValidEmail(value) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(value).trim());
}

/**
 * CPF: exige os 11 dígitos e valida os dois dígitos verificadores.
 * Sequências repetidas (111.111.111-11) são rejeitadas.
 */
function isValidCPF(value) {
  const cpf = String(value).replace(/\D/g, '');

  if (cpf.length !== 11) return false;
  if (/^(\d)\1{10}$/.test(cpf)) return false;

  const checkDigit = (length) => {
    let sum = 0;
    for (let i = 0; i < length; i += 1) {
      sum += Number(cpf[i]) * (length + 1 - i);
    }
    const rest = (sum * 10) % 11;
    return rest === 10 ? 0 : rest;
  };

  return checkDigit(9) === Number(cpf[9]) && checkDigit(10) === Number(cpf[10]);
}
const validators = {
  nome: isValidName,
  email: isValidEmail,
  cpf: isValidCPF,
};

 * roda sem erro de console e sem rede, inclusive aberto direto do disco.
 */
const figmaAssets = {
  // Vale só para a versão modular (index.html + servidor local): os arquivos
  // são carregados de `assets/` assim que existirem — basta exportar e dar
  // refresh. O build de arquivo único detecta e embute sozinho (veja abaixo).
  enabled: true,
  base: 'assets/',
  files: {
    canaltech: 'canaltech-white.svg',
    motorola: 'motorola-white.svg',
    kv: 'kv-edge-70-fusion.jpg',
  },
};

/**
 * Caminho do asset, ou null quando os originais ainda não estão disponíveis.
 *
 * O `build.mjs` procura os arquivos em `assets/` na hora de gerar o bundle e,
 * se encontrar, embute cada um como data URI em `globalThis.__FIGMA_ASSETS__`.
 * Ou seja: basta exportar os arquivos do Figma e rodar `node build.mjs` — o
 * arquivo único passa a usar os originais, ainda 100% offline e sem editar
 * uma linha de código.
 */
function assetPath(key) {
  const embedded = globalThis.__FIGMA_ASSETS__?.[key];
  if (embedded) return embedded;

  // No arquivo único não existe pasta `assets/` ao lado: se o asset não foi
  // embutido no build, vai direto para o fallback em vez de pedir um 404.
  if (globalThis.__FIGMA_ASSETS_EMBEDDED_ONLY__) return null;

  if (!figmaAssets.enabled) return null;
  return figmaAssets.base + figmaAssets.files[key];
}

/**
 * cmp / button (33:108)
 *
 * type: 'primary' (Primary Neon)  — ação principal
 *       'glow'    (Secondary Glow) — ação de resgate
 *       'purple'  (Tertiary Purple) — ação secundária / link externo
 *
 * Os estados Default / Pressed / Disabled do Figma são cobertos por CSS
 * (`:active` e `:disabled`); aqui expomos só o estado de loading do submit.
 */
function createButton({ type = 'primary', label, icon, iconSize, onClick, disabled = false, attrs = {} }) {
  const labelNode = h('span', { class: 'btn__label' }, label);

  const button = h(
    'button',
    {
      class: `btn btn--${type}`,
      type: 'button',
      'aria-disabled': disabled ? 'true' : 'false',
      ...attrs,
      onClick: onClick || undefined,
    },
    labelNode,
    icon ? svgNode(icons[icon](iconSize)) : null,
  );

  return {
    el: button,

    /**
     * Usa `aria-disabled` em vez do atributo `disabled`.
     *
     * Um botão nativamente desabilitado não emite clique nenhum — e o design
     * pede justamente que a tentativa de envio com dados incompletos acenda o
     * estado Error dos campos. Com `aria-disabled` o CTA continua com a
     * aparência inativa (verde-oliva opaco) e anunciado como desabilitado para
     * leitores de tela, mas ainda entrega o clique que dispara o feedback.
     */
    setDisabled(value) {
      button.setAttribute('aria-disabled', value ? 'true' : 'false');
    },

    /** Troca o rótulo por um spinner enquanto o envio é simulado. */
    setLoading(loading, loadingLabel) {
      if (loading) {
        // Aqui o bloqueio é real: nada de reenviar durante o envio.
        button.disabled = true;
        button.dataset.loading = 'true';
        labelNode.textContent = loadingLabel || label;
        if (!button.querySelector('.btn__spinner')) {
          button.append(h('span', { class: 'btn__spinner' }));
        }
      } else {
        delete button.dataset.loading;
        labelNode.textContent = label;
        button.querySelector('.btn__spinner')?.remove();
      }
    },
  };
}

/* ---- src/js/components/Input.js ---- */
/**
 * cmp / input-field (35:33)
 *
 * Estados do Figma mapeados em classes:
 *   Default  → (nenhuma)      borda grey-400, placeholder
 *   Focused  → .is-focused    borda roxa + glow + chip de label
 *   Filled   → .is-filled     borda grey-300 + chip de label
 *   Error    → .is-error      borda vermelha, ícone de alerta e mensagem
 *
 * O erro só aparece depois da primeira tentativa de envio ou do blur de um
 * campo já "sujo" — validar a cada tecla puniria quem ainda está digitando.
 */
function createInput({ name, label, placeholder, type = 'text', autocomplete, inputmode, maxlength, validate, errorMessage, onInput }) {
  const input = h('input', {
    class: 'field__input',
    id: `field-${name}`,
    name,
    type,
    placeholder,
    autocomplete: autocomplete || 'off',
    inputmode: inputmode || undefined,
    maxlength: maxlength || undefined,
    'aria-describedby': `helper-${name}`,
  });

  const helper = h('p', { class: 'field__helper', id: `helper-${name}`, role: 'alert' }, errorMessage);

  const field = h(
    'div',
    { class: 'field' },
    h(
      'div',
      { class: 'field__box' },
      input,
      h('label', { class: 'field__label', for: `field-${name}` }, label),
      h('span', { class: 'field__alert' }, svgNode(icons.alert(20))),
    ),
    helper,
  );

  let touched = false;
  let showError = false;

  const isValid = () => (validate ? validate(input.value) : true);

  const syncFilled = () => {
    field.classList.toggle('is-filled', input.value.trim().length > 0);
  };

  const render = () => {
    syncFilled();
    field.classList.toggle('is-error', showError);
    input.setAttribute('aria-invalid', showError ? 'true' : 'false');
  };

  input.addEventListener('focus', () => {
    field.classList.add('is-focused');
  });

  input.addEventListener('blur', () => {
    field.classList.remove('is-focused');
    // Só acusa erro no blur se o usuário já tiver digitado algo no campo.
    if (touched && input.value.trim().length > 0) {
      showError = !isValid();
    }
    render();
  });

  input.addEventListener('input', () => {
    touched = true;
    if (name === 'cpf') applyCPFMask(input);
    // Erro visível some assim que o valor passa a ser válido.
    if (showError && isValid()) showError = false;
    render();
    onInput?.();
  });

  return {
    el: field,
    input,
    name,

    get value() {
      return input.value;
    },

    isValid,

    /** Chamado no submit: acende o estado Error se o campo estiver inválido. */
    validateNow() {
      const valid = isValid();
      showError = !valid;
      render();
      return valid;
    },

    focus() {
      input.focus();
    },

    reset() {
      input.value = '';
      touched = false;
      showError = false;
      field.classList.remove('is-focused');
      render();
    },
  };
}

/* ---- src/js/components/Checkbox.js ---- */
/**
 * cmp / checkbox (34:23)
 *
 * Checked=False → box com borda grey-300 e label grey-100
 * Checked=True  → box verde neon preenchido + label verde neon
 *
 * Usa um <input type="checkbox"> nativo escondido para manter teclado,
 * leitores de tela e o estado do formulário funcionando de graça.
 */
function createCheckbox({ name, label, required = false, onChange }) {
  const native = h('input', {
    class: 'checkbox__native',
    type: 'checkbox',
    id: `check-${name}`,
    name,
    required,
  });

  const box = h('span', { class: 'checkbox__box' }, svgNode(icons.check(12)));
  const text = h('span', { class: 'checkbox__label' }, label);

  const wrapper = h('label', { class: 'checkbox', for: `check-${name}` }, native, box, text);

  native.addEventListener('change', () => {
    if (native.checked) wrapper.classList.remove('is-error');
    onChange?.(native.checked);
  });

  return {
    el: wrapper,
    name,

    get checked() {
      return native.checked;
    },

    /** Consentimento obrigatório não aceito → destaque em vermelho. */
    setError(value) {
      wrapper.classList.toggle('is-error', Boolean(value));
    },

    reset() {
      native.checked = false;
      wrapper.classList.remove('is-error');
    },
  };
}

/**

 *
 * O host `www.figma.com` está bloqueado pela política de egresso deste
 * ambiente, então os exports reais (16:3 canaltech_white, 16:20
 * motorola_white e 16:34 KV — Edge 70 Fusion+) não puderam ser baixados.
 *
 * Cada marca é renderizada com um fallback desenhado em SVG/CSS na caixa
 * exata do design. Quando `src/js/data/assets.js` for ligado, um <img> passa
 * a ser inserido e assume o lugar do fallback assim que carrega — sem
 * mudança nenhuma no resto do código.
 */
function withFallback({ className, width, height, assetKey, fallback, alt }) {
  const wrapper = h(
    'span',
    {
      class: className,
      style: { width: `${width}px`, height: `${height}px` },
      role: 'img',
      'aria-label': alt,
    },
    fallback,
  );

  const src = assetPath(assetKey);
  if (src) {
    const img = h('img', { class: 'brand__img', src, alt, hidden: true });
    img.addEventListener('load', () => {
      img.hidden = false;
      fallback.hidden = true;
    });
    wrapper.append(img);
  }

  return wrapper;
}

/* ---- src/js/components/Modal.js ---- */
/**
 * Base compartilhada pelos modais 02 (Regras) e 03 (Sucesso).
 *
 * Cuida do overlay com dim + blur, do fechamento por ESC / clique fora,
 * do bloqueio de scroll do body e da devolução do foco ao elemento que
 * abriu o modal.
 */
function createModal({ panelClass, labelledBy, onClose }) {
  const panel = h('div', {
    class: `overlay__panel ${panelClass}`,
    role: 'dialog',
    'aria-modal': 'true',
    'aria-labelledby': labelledBy,
  });

  const overlay = h('div', { class: 'overlay', hidden: true }, panel);

  let lastFocused = null;

  // Clique no backdrop (fora do painel) fecha.
  overlay.addEventListener('mousedown', (event) => {
    if (event.target === overlay) close();
  });

  const onKeydown = (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      close();
      return;
    }

    // Mantém o foco preso dentro do modal enquanto ele estiver aberto.
    if (event.key === 'Tab') {
      const focusables = panel.querySelectorAll(
        'button:not([disabled]), a[href], input:not([disabled]), [tabindex]:not([tabindex="-1"])',
      );
      if (!focusables.length) return;

      const first = focusables[0];
      const last = focusables[focusables.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  };

  function open() {
    if (overlay.classList.contains('is-open')) return;

    lastFocused = document.activeElement;
    overlay.hidden = false;
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', onKeydown);

    // Dois frames para o browser aplicar o estado inicial antes de animar.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => overlay.classList.add('is-open'));
    });

    panel.querySelector('.modal__close')?.focus();
  }

  function close() {
    if (!overlay.classList.contains('is-open')) return;

    overlay.classList.remove('is-open');
    document.body.style.overflow = '';
    document.removeEventListener('keydown', onKeydown);

    const finish = () => {
      overlay.hidden = true;
      lastFocused?.focus?.();
      onClose?.();
    };

    // Espera a transição de opacidade terminar antes de esconder de fato.
    const reduced = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    if (reduced) finish();
    else setTimeout(finish, 200);
  }

  return { el: overlay, panel, open, close };
}

/**
 * Copia texto para a área de transferência.
 *
 * `navigator.clipboard` só existe em contexto seguro — como este protótipo
 * também roda aberto direto do disco (file://), há um fallback com textarea
 * temporária + execCommand para o arquivo baixado continuar funcionando.
 */
async function copyToClipboard(text) {
  if (navigator.clipboard?.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      /* cai no fallback abaixo */
    }
  }

  try {
    const helper = document.createElement('textarea');
    helper.value = text;
    helper.setAttribute('readonly', '');
    helper.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
    document.body.append(helper);
    helper.select();
    const ok = document.execCommand('copy');
    helper.remove();
    return ok;
  } catch {
    return false;
  }
}

/**
 * Screen 03 — Sucesso / Voucher (12:45)
 *
 * Disparado após o envio válido do formulário. Traz o cupom copiável
 * (cmp / coupon-tag) e o número da sorte (cmp / voucher-card).
 */
function createModalSuccess({ onClose }) {
  const { success } = content;

  const modal = createModal({
    panelClass: 'success',
    labelledBy: 'success-title',
    onClose,
  });

  // ---- Card do cupom (19:36) — tag copiável -------------------------------
  const couponIcon = h('span', { class: 'coupon__icon' }, svgNode(icons.copy(20)));
  const couponHelper = h('p', { class: 'voucher__helper t-body' }, success.couponHelper);

  const couponTag = h(
    'button',
    {
      class: 'coupon',
      type: 'button',
      'aria-label': `Copiar o código ${success.couponCode}`,
    },
    h('span', { class: 'coupon__code' }, success.couponCode),
    couponIcon,
  );

  let resetTimer = null;

  couponTag.addEventListener('click', async () => {
    const copied = await copyToClipboard(success.couponCode);
    if (!copied) return;

    // Estado "Pressed" do cmp / coupon-tag: ícone vira check duplo.
    couponTag.classList.add('is-copied');
    couponIcon.replaceChildren(svgNode(icons.checkDouble(20)));
    couponHelper.textContent = success.couponHelperCopied;
    couponHelper.classList.add('is-copied');

    clearTimeout(resetTimer);
    resetTimer = setTimeout(resetCoupon, 2500);
  });

  function resetCoupon() {
    clearTimeout(resetTimer);
    couponTag.classList.remove('is-copied');
    couponIcon.replaceChildren(svgNode(icons.copy(20)));
    couponHelper.textContent = success.couponHelper;
    couponHelper.classList.remove('is-copied');
  }

  const couponCard = h(
    'div',
    { class: 'voucher voucher--cupom' },
    h('span', { class: 'voucher__badge' }, success.couponBadge),
    couponTag,
    couponHelper,
  );

  // ---- Card do número da sorte (19:44) ------------------------------------
  const luckyCard = h(
    'div',
    { class: 'voucher voucher--sorte' },
    h('span', {
      class: 'voucher__badge',
      html: `${success.luckyBadge} <em>${success.luckyBadgeAccent}</em>`,
    }),
    h(
      'div',
      { class: 'voucher__value' },
      h('p', { class: 'voucher__number' }, success.luckyNumber),
      h('span', { class: 'voucher__trophy' }, svgNode(icons.trophy(30))),
    ),
    h('p', { class: 'voucher__helper t-body' }, success.luckyHelper),
  );

  // ---- CTA de resgate (19:52) ---------------------------------------------
  const redeemButton = createButton({
    type: 'glow',
    label: success.cta,
    icon: 'chevronRight',
    iconSize: 24,
    onClick: () => window.open(success.ctaUrl, '_blank', 'noopener,noreferrer'),
  });

  modal.panel.append(
    h(
      'div',
      { class: 'success__content' },
      createTopBar(modal.close, 'Fechar e voltar ao formulário'),
      h(
        'div',
        { class: 'success__title' },
        h('p', { class: 'success__eyebrow t-h1' }, success.eyebrow),
        h('h2', { class: 'success__headline t-h1', id: 'success-title' }, success.headline),
        h('p', { class: 'success__support t-small' }, success.support),
      ),
      couponCard,
      luckyCard,
      redeemButton.el,
      h('p', { class: 'success__info t-body' }, success.info),
    ),
    h(
      'div',
      { class: 'success__footer' },
      h('p', { class: 't-body' }, success.footer),
    ),
  );

  return {
    ...modal,
    open() {
      resetCoupon();
      modal.open();
    },
  };
}

/* ---- src/js/components/Form.js ---- */
/**
 * Screen 01 — bloco de formulário (16:44)
 *
 * Regras de liberação do CTA:
 *   nome ≥ 3 caracteres  ·  e-mail válido  ·  CPF válido (11 dígitos + DV)
 *   ·  checkbox do Regulamento marcado
 *
 * Enquanto qualquer um falhar, o botão fica no estado Disabled (verde-oliva
 * opaco). Se o usuário tentar enviar assim mesmo, cada campo inválido acende
 * o estado Error e o foco vai para o primeiro deles.
 */
function createForm({ onSuccess }) {
  const { form, errors } = content;

  const inputs = form.fields.map((field) =>
    createInput({
      ...field,
      validate: validators[field.name],
      errorMessage: errors[field.name],
      onInput: () => syncSubmitState(),
    }),
  );

  const checkboxes = form.consents.map((consent) =>
    createCheckbox({
      ...consent,
      onChange: () => syncSubmitState(),
    }),
  );

  const requiredConsent = checkboxes.find((box) => box.name === 'regulamento');

  const submit = createButton({
    type: 'primary',
    label: form.submit,
    disabled: true,
    attrs: { type: 'submit' },
  });

  const isFormValid = () =>
    inputs.every((input) => input.isValid()) && requiredConsent.checked;

  function syncSubmitState() {
    submit.setDisabled(!isFormValid());
  }

  const el = h(
    'form',
    { class: 'form', novalidate: true },
    inputs.map((input) => input.el),
    h('div', { class: 'form__consents' }, checkboxes.map((box) => box.el)),
    submit.el,
  );

  el.addEventListener('submit', async (event) => {
    event.preventDefault();

    // Acende o estado Error de tudo que estiver inválido.
    const results = inputs.map((input) => input.validateNow());
    const consentOk = requiredConsent.checked;
    requiredConsent.setError(!consentOk);

    if (!results.every(Boolean) || !consentOk) {
      // Enter num input dispara submit mesmo com o botão desabilitado —
      // ressincroniza para o estado do CTA nunca mentir sobre a validação.
      syncSubmitState();
      const firstInvalid = inputs.find((input, index) => !results[index]);
      firstInvalid?.focus();
      return;
    }

    // Envio simulado — 500ms de loading antes de abrir a tela de sucesso.
    submit.setLoading(true, form.submitting);
    await new Promise((resolve) => setTimeout(resolve, 500));
    submit.setLoading(false);
    syncSubmitState();

    onSuccess?.({
      nome: inputs[0].value,
      email: inputs[1].value,
      cpf: inputs[2].value,
      ofertas: checkboxes[1].checked,
    });
  });

  return {
    el,

    /** Volta a tela 01 ao estado inicial — usado ao fechar o modal de sucesso. */
    reset() {
      inputs.forEach((input) => input.reset());
      checkboxes.forEach((box) => box.reset());
      submit.setLoading(false);
      syncSubmitState();
    },
  };
}
